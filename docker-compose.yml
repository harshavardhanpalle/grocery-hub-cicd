name: grocery

x-pyhealth: &pyhealth
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  product-service:
    build: ./services/product-service
    image: grocery-hub/product-service:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      UVICORN_LOG_LEVEL: ${LOG_LEVEL:-info}
      SIMULATE_UNHEALTHY: ${SIMULATE_UNHEALTHY:-false}   # demo hook for the rollback exercise
    volumes: [product-data:/data]
    healthcheck: *pyhealth
    restart: unless-stopped
    networks: [backend]

  order-service:
    build: ./services/order-service
    image: grocery-hub/order-service:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      UVICORN_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: [order-data:/data]
    depends_on:
      product-service: { condition: service_healthy }
    healthcheck: *pyhealth
    restart: unless-stopped
    networks: [backend]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    image: grocery-hub/gateway:${IMAGE_TAG:-latest}
    ports: ["${GATEWAY_PORT:-80}:8080"]
    depends_on:
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [backend]

volumes:            # named volumes: data survives redeploys and rollbacks
  product-data:
  order-data:

networks:
  backend:
