<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenbarrow Grocer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EA;--ink:#17261C;--leaf:#2E5E3E;--tomato:#D8432E;--citrus:#F2B632;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121C15;--ink:#E8F0E6;--card:#1B2A20;--leaf:#7BC28F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
header{padding:2.5rem 5vw 1rem;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
h1{font:800 clamp(2.4rem,7vw,4.5rem)/.95 'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.03em}
h1 small{display:block;font:500 1rem Figtree;letter-spacing:0;margin-top:.6rem;opacity:.75}
button{font:600 1rem Figtree;cursor:pointer;border:0;border-radius:6px;padding:.6rem 1rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--citrus);outline-offset:2px}
.cartbtn{background:var(--leaf);color:#fff}
nav{padding:0 5vw;display:flex;gap:.5rem;flex-wrap:wrap}
nav button{background:transparent;color:var(--ink);border:2px solid var(--leaf)}
nav button[aria-pressed=true]{background:var(--leaf);color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;padding:1.5rem 5vw 4rem}
.item{background:var(--card);border-radius:14px 14px 14px 2px;padding:1rem;display:flex;flex-direction:column;gap:.2rem}
.item .e{font-size:3rem;line-height:1}
.item h3{margin:.4rem 0 0;font:800 1.15rem 'Bricolage Grotesque'}
.item .p{font-weight:600}.item .p span{opacity:.6;font-weight:400}
.item .s{font-size:.85rem;opacity:.65}
.item button{margin-top:auto;background:var(--tomato);color:#fff}
.item button:disabled{background:#999}
aside{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--card);padding:1.5rem;transform:translateX(105%);transition:transform .25s;overflow:auto;box-shadow:-8px 0 30px #0003}
aside.open{transform:none}
aside h2{font:800 1.6rem 'Bricolage Grotesque';margin:0 0 1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid #8883}
.row div button{padding:.15rem .6rem;background:var(--bg);color:var(--ink)}
input{width:100%;padding:.6rem;margin:.3rem 0 .8rem;border:2px solid #8886;border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.total{font:800 1.4rem 'Bricolage Grotesque';margin:1rem 0}
.place{width:100%;background:var(--citrus);color:#17261C}
#msg{margin-top:1rem;font-weight:600}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style></head><body>
<header>
  <h1>Greenbarrow Grocer<small>Fresh food, ordered in a minute.</small></h1>
  <button class="cartbtn" id="open">Cart (<span id="count">0</span>)</button>
</header>
<nav id="cats" aria-label="Categories"></nav>
<main id="grid" aria-live="polite"></main>
<aside id="cart" aria-label="Your cart">
  <button id="close" style="float:right">Close</button>
  <h2>Your cart</h2>
  <div id="lines"></div>
  <div class="total">Total: <span id="total">$0.00</span></div>
  <label>Name<input id="name" autocomplete="name"></label>
  <label>Delivery address<input id="addr" autocomplete="street-address"></label>
  <button class="place" id="place">Place order</button>
  <div id="msg" role="status"></div>
</aside>
<script>
const $=id=>document.getElementById(id), money=n=>'$'+n.toFixed(2);
let products=[], cart={}, cat='All';
async function load(){
  try{products=await (await fetch('/api/products')).json()}catch{ $('grid').textContent='Could not load products. Check that the services are running.';return}
  const cats=['All',...new Set(products.map(p=>p.category))];
  $('cats').innerHTML=cats.map(c=>`<button aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('');
  render();
}
function render(){
  $('grid').innerHTML=products.filter(p=>cat==='All'||p.category===cat).map(p=>`
    <article class="item"><div class="e" aria-hidden="true">${p.emoji}</div><h3>${p.name}</h3>
    <div class="p">${money(p.price)} <span>${p.unit}</span></div><div class="s">${p.stock>0?p.stock+' in stock':'Out of stock'}</div>
    <button data-add="${p.id}" ${p.stock<1?'disabled':''}>Add to cart</button></article>`).join('');
  renderCart();
}
function renderCart(){
  const ids=Object.keys(cart); let t=0,n=0;
  $('lines').innerHTML=ids.length?ids.map(id=>{const p=products.find(x=>x.id==id),q=cart[id];t+=p.price*q;n+=q;
    return `<div class="row"><span>${p.emoji} ${p.name}</span><div>
    <button data-dec="${id}" aria-label="Remove one ${p.name}">−</button> ${q} <button data-inc="${id}" aria-label="Add one ${p.name}">+</button></div></div>`}).join(''):'<p>Your cart is empty. Add something fresh from the shelves.</p>';
  $('total').textContent=money(t); $('count').textContent=n;
}
document.addEventListener('click',e=>{
  const d=e.target.dataset;
  if(d.c){cat=d.c;document.querySelectorAll('#cats button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===cat));render()}
  if(d.add||d.inc){const id=d.add||d.inc;cart[id]=(cart[id]||0)+1;renderCart()}
  if(d.dec){if(--cart[d.dec]<1)delete cart[d.dec];renderCart()}
});
$('open').onclick=()=>$('cart').classList.add('open');
$('close').onclick=()=>$('cart').classList.remove('open');
$('place').onclick=async()=>{
  const items=Object.entries(cart).map(([product_id,qty])=>({product_id:+product_id,qty}));
  if(!items.length) return $('msg').textContent='Add at least one item before ordering.';
  if(!$('name').value||!$('addr').value) return $('msg').textContent='Enter your name and delivery address.';
  const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer:$('name').value,address:$('addr').value,items})});
  const j=await r.json();
  if(r.ok){cart={};$('msg').textContent=`Order #${j.id} placed. Total ${money(j.total)}.`;load()}
  else $('msg').textContent=j.detail||'Order failed. Try again.';
};
load();
</script></body></html>
