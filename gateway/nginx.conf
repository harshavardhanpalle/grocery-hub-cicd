server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz    { access_log off; return 200 "ok\n"; }
    location /api/products { proxy_pass http://product-service:8000/products; }
    location /api/orders   { proxy_pass http://order-service:8000/orders; }
    location /             { try_files $uri /index.html; }
}
